[workspace]
resolver = "3"
members = [
  "crates/hangar-aws",
  "crates/hangar-auth-loopback",
  "crates/hangar-auth-oidc",
  "crates/hangar-board",
  "crates/hangar-core",
  "crates/hangar-render",
  "crates/hangar-server",
  "crates/hangar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/hangar"
# LIB-4: the minimum supported Rust version equals the toolchain pin in
# rust-toolchain.toml.
rust-version = "1.99.1"

[workspace.dependencies]
# Random bytes, SHA-256 and constant-time comparison for hangar-auth-oidc
# and hangar-auth-loopback; jsonwebtoken's aws_lc_rs backend already brings
# it in.
aws-lc-rs = "1.19.0"
# Runs hangar-board's board children, hangar-auth-oidc's Keychain reader and
# the hangar command's browser opener in a process group of their own, with a
# deadline and output byte limits (PROC-2). Evaluated in
# /evals/hangar-board-dependencies.
# Replaces hangar-auth-loopback's server file atomically: a new file beside
# it, synced, renamed, with the directory synced (DUR-1).
crumbkit-durable = "=0.6.0"
crumbkit-process = { version = "=0.6.0", default-features = false }
# base64url for the state, nonce, PKCE verifier and session secrets.
base64 = "0.23.1"
# hangar-aws keeps shares and grants in DynamoDB and files in S3 through the
# official SDK crates. Their default features are off: the defaults add a
# second, older TLS stack with open advisories and a credential provider that
# starts child processes. default-https-client uses rustls on aws-lc-rs, the
# version above. The SDK was compared with object_store and with a
# hand-written client on aws-sigv4 before it was adopted.
aws-config = { version = "=1.13.3", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-dynamodb = { version = "=1.140.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.161.0", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x", "behavior-version-latest"] }
# The types and traits that hangar-auth-oidc and hangar-auth-loopback
# implement and that hangar-render builds on.
hangar-core = { path = "crates/hangar-core", version = "0.1.0" }
# The method and header types of a request, which hangar-auth-loopback checks
# before a route runs; reqwest and hyper already bring it in.
http = "1.5.0"
# The O_NONBLOCK flag for opening hangar-auth-loopback's server file, so a
# FIFO in its place cannot block the open; tokio and mio already bring it in.
libc = "0.2.191"
# Verifies the RS256 signature of an OpenID Connect ID token.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
# Renders the Mustache templates of HTML pages in hangar-render. Its optional
# serde feature stays off, because hangar-render builds the template data
# from serde_json values itself.
mustache2 = { version = "1.0.7", default-features = false }
# Parses Markdown pages in hangar-render, which writes the HTML itself, so the
# html and getopts features stay off.
pulldown-cmark = { version = "0.13.6", default-features = false }
# The HTTPS client for an OpenID provider's discovery, token and key set
# requests.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form"] }
# BASE-24: a credential is held in a type whose Debug prints a placeholder.
secrecy = "0.10.3"
# Reads the provider's metadata, token reply, key set and ID token claims,
# and hangar-auth-loopback's server file.
serde = { version = "1.0.229", features = ["derive"] }
# Parses the JSON that serde's derived types read. hangar-render reads
# record bodies and schemas with it and writes the new body of an edit.
serde_json = "1.0.154"
# Typed error enums with source() and Display derived.
thiserror = "2.0.21"
# Builds the authorisation URL and parses the callback query.
url = "2.5.8"

# The crates that hangar-server and the hangar binary build on.
hangar-auth-loopback = { path = "crates/hangar-auth-loopback", version = "0.1.0" }
hangar-auth-oidc = { path = "crates/hangar-auth-oidc", version = "0.1.0" }
hangar-board = { path = "crates/hangar-board", version = "0.1.0" }
hangar-render = { path = "crates/hangar-render", version = "0.1.0" }
hangar-server = { path = "crates/hangar-server", version = "0.1.0" }

# The hangar binary's command line, failures, documents and usage log
# (the cli profile). Evaluated in /evals/hangar-server-dependencies.
clap = { version = "=4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crumbkit = { version = "=0.6.0", features = ["derive"] }
crumbkit-usage = "=0.6.0"
# Test-only: the cli profile's convention checks.
crumbkit-test = "=0.6.0"
# The JSON Schemas of the binary's documents, which crumbkit's Row and
# Document need; crumbkit already brings it in.
schemars = "1.2.3"
# hangar-server's structured request log (SVC-9); reqwest and hyper already
# bring tracing in. tracing-subscriber, evaluated in
# /evals/hangar-server-dependencies, writes it to standard error.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
# Decodes a form post's body; url and reqwest already bring it in.
form_urlencoded = "1.2.2"

# hangar-auth-oidc serialises its key set refreshes with tokio's async mutex,
# hangar-server runs on Tokio, and the fake OpenID provider in tests is an
# HTTP server on a Tokio runtime.
tokio = "1.54.1"
# hangar-server's HTTP/1 server, and the fake provider's in tests.
hyper = "1.12.0"
# Connects hyper to Tokio's sockets and shuts connections down gracefully.
hyper-util = "0.1.21"
# The request and reply bodies, and the body size limit.
http-body-util = "0.1.5"
# Test-only: the HTML tokenizer that hangar-render's tests read its output
# with, as a browser would.
html5ever = "0.40.1"
# Test-only: hangar-render's property tests.
proptest = "1.12.0"

# BASE-27: an integer overflow panics in a release build as it does in a
# debug build.
[profile.release]
overflow-checks = true

# The [workspace.lints] tables of the base and library profiles of the Rust
# standards (baseline/lints/base.toml and baseline/lints/library.toml).

[workspace.lints.rust]
unsafe_code = "forbid"                 # BASE-3
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"
missing_docs = "deny"                  # LIB-2

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny" # LIB-2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16
missing_errors_doc = "deny"              # LIB-2
missing_panics_doc = "deny"              # LIB-2
must_use_candidate = "deny"              # LIB-3
